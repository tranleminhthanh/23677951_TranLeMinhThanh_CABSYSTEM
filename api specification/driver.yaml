openapi: 3.0.3

info:
  title: CAB Driver API
  description: API quản lý tài xế trong hệ thống CAB
  version: 1.0.0

servers:
  - url: http://localhost:3000/api

tags:
  - name: Driver
    description: Các chức năng quản lý tài xế

paths:

  /drivers/{driverId}:
    get:
      tags:
        - Driver
      summary: Xem thông tin tài xế
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lấy thông tin tài xế thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '404':
          description: Không tìm thấy tài xế

    put:
      tags:
        - Driver
      summary: Cập nhật thông tin tài xế
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverUpdate'
      responses:
        '200':
          description: Cập nhật thông tin tài xế thành công
        '400':
          description: Dữ liệu không hợp lệ
        '404':
          description: Không tìm thấy tài xế

  /drivers/{driverId}/status:
    put:
      tags:
        - Driver
      summary: Cập nhật trạng thái tài xế
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - AVAILABLE
                    - BUSY
                    - OFFLINE
                  example: AVAILABLE
      responses:
        '200':
          description: Cập nhật trạng thái thành công
        '400':
          description: Trạng thái không hợp lệ
        '404':
          description: Không tìm thấy tài xế

  /drivers/{driverId}/location:
    put:
      tags:
        - Driver
      summary: Cập nhật vị trí tài xế
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverLocation'
      responses:
        '200':
          description: Cập nhật vị trí thành công
        '400':
          description: Vị trí không hợp lệ
        '404':
          description: Không tìm thấy tài xế

  /drivers/{driverId}/trips/{tripId}/accept:
    post:
      tags:
        - Driver
      summary: Tài xế chấp nhận chuyến
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tài xế chấp nhận chuyến thành công
        '400':
          description: Tài xế không thể nhận chuyến
        '404':
          description: Không tìm thấy tài xế hoặc chuyến

  /drivers/{driverId}/trips/{tripId}/reject:
    post:
      tags:
        - Driver
      summary: Tài xế từ chối chuyến
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tài xế từ chối chuyến thành công
        '404':
          description: Không tìm thấy tài xế hoặc chuyến

components:

  schemas:

    Driver:
      type: object
      properties:
        driverId:
          type: string
          example: DR001
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        vehicleId:
          type: string
          example: VH001
        status:
          type: string
          enum:
            - AVAILABLE
            - BUSY
            - OFFLINE
          example: AVAILABLE

    DriverUpdate:
      type: object
      properties:
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        vehicleId:
          type: string
          example: VH001

    DriverLocation:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.8231
        longitude:
          type: number
          format: double
          example: 106.6297
